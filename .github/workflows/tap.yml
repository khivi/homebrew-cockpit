# Tap CI on ubuntu-latest (Homebrew is fully supported there):
#   syntax  — `brew test-bot --only-tap-syntax` (style + audit), plus the one
#             pre-commit hook that isn't already covered by it. Static, no
#             tarball download, so it's safe to run on every push/PR.
#   install — a real `brew install` from this checkout, then three checks on the
#             result: `cockpit --version`, `brew test` (which imports the TUI),
#             and `uv pip check` (which verifies the resource set is a complete
#             closure). This is the only place anywhere that exercises the
#             formula's `resource` blocks: the release CI in khivi/cockpit
#             rewrites only `url` + `sha256`, and the vendored dependency tree is
#             regenerated by hand (`brew update-python-resources`). So a
#             dependency bump that isn't followed by that command fails HERE
#             rather than on a user's `brew upgrade`. brew also verifies the
#             tarball checksum on download, so a bad `sha256` fails too.
#
# Because it triggers on pull_request, the release bump PR that
# bump-homebrew-formula-action opens (`update-cockpit.rb-*`) is install-tested
# before it is merged.
#
# Linux suffices — cockpit and its deps are pure Python, so the resource graph
# resolves identically. The daemon itself is never exercised: `cockpit watch`
# exits 2 without a TTY.
name: tap
on: [push, pull_request]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
      - run: brew test-bot --only-tap-syntax

      # Only the zizmor hook, not `--all-files`: `brew test-bot` above already
      # runs `brew style`, and `ruby -c` is subsumed by it, so the other two
      # hooks would be pure duplication. Through pre-commit rather than
      # `uvx zizmor` so the version lives in exactly one place — the hook's
      # `rev`, which dependabot bumps.
      #
      # Without this step the audit runs only where someone has run
      # `pre-commit install`, since that writes the hook into that one clone's
      # .git/hooks and nowhere else. A commit made from the GitHub web UI, from
      # a clone that skipped the setup, or with `--no-verify` runs none of it.
      # CI is the only place the check is unconditional.
      - run: pipx run pre-commit run zizmor --all-files

  install:
    runs-on: ubuntu-latest
    steps:
      # `persist-credentials: false` on a checkout the install job then symlinks
      # in as a tap directory: brew's own git operations against it are public
      # fetches, and nothing here pushes.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
      # Homebrew rejects `install ./Formula/cockpit.rb` ("formulae must be in a
      # tap"), and `brew tap khivi/cockpit "$GITHUB_WORKSPACE"` collides with
      # the tap setup-homebrew already registered against the GitHub remote
      # ("remote mismatch"). Pointing the tap directory at this checkout is what
      # makes the *proposed* formula the one installed — tapping by name would
      # silently test the default branch instead.
      - run: |
          tap_dir="$(brew --repository)/Library/Taps/khivi/homebrew-cockpit"
          rm -rf "$tap_dir"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"
          brew install --build-from-source khivi/cockpit/cockpit
          cockpit --version
          # `brew install` does not run the formula's `test do` block, and that
          # block holds the only check that the resources can run this cockpit —
          # `cockpit --version` above passes against a venv with no textual.
          brew test khivi/cockpit/cockpit

      # Completeness, which the import probe does not imply: brew installs every
      # resource with `--no-deps`, so no `Requires-Dist` is ever evaluated during
      # a build, and a dependency that a sibling resource needs but cockpit never
      # imports goes missing without breaking any import — linkify-it-py used to
      # require uc-micro-py, and nothing connected the two.
      #
      # `uv pip check` and not `pip check`, which exits 1 on this venv today over
      # `wheel requires packaging` — Homebrew's own scaffolding. uv skips the
      # seed packages, so it fails only on cockpit's closure. (`pipdeptree
      # --warn fail` trips on the same noise even scoped to one package.)
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv pip check --python "$(brew --prefix cockpit)/libexec/bin/python"
